# application.properties (main module)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.groups-order=asc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Show all groups in one Swagger UI
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/product-service

springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/user-service